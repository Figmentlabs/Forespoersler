name: Poll brokerforespørsler

on:
  schedule:
    # Hvert 5. minutt (UTC). NB: GitHub kjører planlagte workflows "best effort"
    # og struper hyppige cron-er hardt – kan hoppe over kjøringer i timevis.
    # For pålitelig polling: trigg via repository_dispatch fra en ekstern
    # planlegger (f.eks. Supabase pg_cron), se README.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [poll]

jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency:
      group: broker-poller
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter
        run: pip install -r poller/requirements.txt

      - name: Kjør poller
        working-directory: poller
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
          # Flere kontoer (valgfritt): JSON-liste, overstyrer feltene over
          IMAP_ACCOUNTS: ${{ secrets.IMAP_ACCOUNTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          # Google OAuth for brukerkoblede Gmail-postkasser
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: python run.py
