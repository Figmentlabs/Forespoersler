<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kvalifiseringstavla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#1C1820; --card:#26212F; --surface:#302A3B;
  --fg:#F4EDE4; --text:#E7E0EC; --soft:#C9C1D4; --muted:#9A90A6;
  --line:rgba(244,237,228,.12); --line-strong:rgba(244,237,228,.26); --ph:#352F42; --pill:#4E4760;
  --inv-bg:#F4EDE4; --inv-fg:#1C1820; --inv-muted:#6B6878; --inv-soft:#4A4757;
  --hl:rgba(75,194,162,.16); --green:#4BC2A2; --purple:#938BCB; --amber:#D6B45C; --red:#D28C8C;
  --accent-ink:#0B1A16;
  --font-display:'Gabarito','Helvetica Neue',Arial,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);letter-spacing:-0.02em;text-wrap:balance}
p{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit;color:var(--fg)}
::placeholder{color:var(--muted)}
[hidden]{display:none!important}  /* må vinne over .gate{display:grid} o.l. */
.gutter{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wordmark{font-family:Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:.14em;text-transform:uppercase;line-height:1}

/* Innlogging / tilstand */
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:24px;z-index:80}
.gatecard{max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.gatecard .wordmark{font-size:26px}
.gatecard h1{font-size:26px;font-weight:600;margin-top:4px}
.gatecard p{color:var(--soft);font-size:15px;max-width:340px}
.gatebtn{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;background:var(--green);color:var(--accent-ink);font-weight:600;border:0;margin-top:4px}
.gatebtn:hover{opacity:.9}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--fg);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}

.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px 20px;padding-block:14px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:14px}
.brand .wordmark{font-size:18px}
.brand .divider{width:1px;height:22px;background:var(--line-strong);opacity:.25}
.brand .app{font-weight:500;font-size:15px;color:var(--soft)}
.viewnav{display:flex;gap:4px}
.viewnav button{min-height:36px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--soft);font-size:14.5px;font-weight:500}
.viewnav button[aria-current="true"]{background:var(--surface);color:var(--fg)}
.importbtn{min-height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--green);background:transparent;color:var(--green);font-size:14px;font-weight:600}
.importbtn:hover{background:var(--hl)}
.topbar .spacer{flex:1}
.userchip{display:inline-flex;align-items:center;gap:9px}
.userchip .uava{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--ph);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--soft)}
.userchip .uname{font-size:14px;font-weight:600}
.logout{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:2px}

.catnav{display:inline-flex;gap:4px;background:var(--surface);border-radius:999px;padding:4px;margin-top:20px}
.catseg{min-height:40px;padding:0 20px;border-radius:999px;border:0;background:transparent;color:var(--soft);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.catseg[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.catseg .cnt{font-variant-numeric:tabular-nums;font-weight:500;opacity:.75}
.catrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.catbadge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 11px;border-radius:999px;white-space:nowrap}
.cat-klar{color:#7fd9b8;background:rgba(75,194,162,.16)}
.cat-mulig{color:#dbbd72;background:rgba(205,165,70,.16)}
.catwhy{font-size:13px;color:var(--muted);min-width:0}
.catmove{margin-left:auto}

.locfilter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:18px}
.locfilter .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.locchips{display:flex;gap:6px;flex-wrap:wrap}
.locchip{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--soft);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.locchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.locchip .cnt{opacity:.65;font-variant-numeric:tabular-nums}
.locclear{border:0;background:transparent;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:2px}

.toolbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--soft);font-size:14px;font-weight:500}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab .cnt{font-variant-numeric:tabular-nums;opacity:.7}
.toolbar .spacer{flex:1}
.sortnote{font-size:13.5px;color:var(--muted)}

.layout{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr);gap:28px;padding-bottom:64px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr;gap:20px}}

.list{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px;text-align:left;width:100%}
.card:hover{border-color:var(--line-strong)}
button.item[aria-current="true"]{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.card.stacked{position:relative;margin-bottom:14px}
.card.stacked::before,.card.stacked::after{content:"";position:absolute;inset:0;border-radius:14px;background:var(--card);border:1px solid var(--line);z-index:-1}
.card.stacked::before{transform:translateY(6px) scaleX(.965)}
.card.stacked::after{transform:translateY(12px) scaleX(.93)}
.stackbadge{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--green);border-radius:999px;padding:3px 10px}
.samemark{color:#7fd9b8;font-weight:600}
.item .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.item h3{font-size:17.5px;font-weight:600;line-height:1.25;margin:6px 0 10px}
.item .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.item .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.bestmatch{display:flex;align-items:baseline;gap:8px;min-width:0}
.bestmatch .pct{font-family:var(--font-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.bestmatch .nm{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .subrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sep{opacity:.5}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ny{color:#8fd0f0;background:rgba(90,170,220,.16)}
.chip.kvalifisert{color:#7fd9b8;background:rgba(75,194,162,.16)}
.chip.avvist{color:#e39a9a;background:rgba(205,120,120,.16)}
.chip.feil{color:#e39a9a;background:rgba(205,120,120,.16)}

.rec-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.rec-kvalifiser{color:#7fd9b8;background:rgba(75,194,162,.16)}
.rec-vurder{color:#dbbd72;background:rgba(205,165,70,.16)}
.rec-avvis{color:#e39a9a;background:rgba(205,120,120,.16)}

.meter{display:inline-flex;gap:3px;align-items:center}
.meter i{width:16px;height:5px;border-radius:2px;background:var(--surface)}
.meter.big i{width:22px;height:7px}
.meter i.on{background:var(--rc,var(--pill))}

.detail{border:1px solid var(--line);border-radius:16px;min-width:0;overflow:hidden;background:var(--card)}
.detail-hd{padding:24px;border-bottom:1px solid var(--line)}
.detail-hd .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.detail-hd h2{font-size:clamp(22px,2.6vw,30px);font-weight:600;line-height:1.1;margin:8px 0 0}
.detail-hd .hdrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kv{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:16px;font-size:13.5px;color:var(--soft)}
.kv b{color:var(--fg);font-weight:600}
.recbanner{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);border-left:4px solid var(--rcol)}
.recverdict{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--rcol)}
.recwhy{font-size:13.5px;color:var(--soft);margin-top:3px}
.recfactors{display:flex;flex-wrap:wrap;gap:7px}
.fac{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--surface);color:var(--soft)}
.fac b{font-weight:600}
.fac.good{background:rgba(75,194,162,.16);color:#7fd9b8} .fac.mid{background:rgba(205,165,70,.16);color:#dbbd72} .fac.bad{background:rgba(205,120,120,.16);color:#e39a9a}
.section{padding:24px;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:0}
.section h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#86C9B3;margin-bottom:16px}
.email{background:var(--surface);border-radius:12px;padding:18px 20px;font-size:15px;color:var(--text);line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:360px;overflow:auto}
.muted-note{color:var(--muted);font-size:13.5px}

.org{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.org .nm{font-weight:600;font-size:16px}
.org .org-meta{font-size:13px;color:var(--muted);margin-top:3px}
.relbox{margin-top:14px;background:var(--surface);border-radius:8px;padding:16px}
.custact{margin-top:14px;background:var(--surface);border-radius:12px;padding:14px 16px}
.custact-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.custact-score{font-family:var(--font-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.custact-max{font-size:13px;color:var(--muted)}
.custact-lbl{font-size:13.5px;color:var(--soft);font-weight:600;margin-left:auto}
.custact .bar{margin-top:10px}
.custact-why{font-size:12.5px;color:var(--muted);margin-top:8px}
.relhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.relbadge{font-family:var(--font-display);font-weight:600;font-size:17px}
.signals{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sig{font-size:12.5px;color:var(--soft);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.sig b{color:var(--fg);font-weight:600}
.relwhy{font-size:13px;color:var(--muted);margin-top:12px}

.svc-row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 0;border-top:1px solid var(--line)}
.svc-row:first-of-type{border-top:0}
.svc-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.svc-name .star{font-size:12px;color:var(--soft);font-weight:500}
.svc-name mark{background:var(--hl);color:var(--fg);padding:1px 6px;border-radius:4px}
.svc-pct{font-family:var(--font-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;align-self:center}
.bar{grid-column:1 / -1;height:8px;background:var(--surface);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.svc-why{grid-column:1 / -1;font-size:13px;color:var(--muted);margin-top:2px}
.tier-strong{background:var(--green)} .tier-med{background:var(--purple)} .tier-low{background:var(--pill)}
.txt-strong{color:#6fd3b2} .txt-med{color:var(--purple)} .txt-low{color:var(--muted)}

.cons{display:flex;flex-direction:column;gap:12px}
.cons-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.cons-top{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center}
.ring::after{content:"";position:absolute;inset:6px;background:var(--surface);border-radius:50%}
.ring b{position:relative;z-index:1;font-family:var(--font-display);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cons-id{flex:1;min-width:0}
.cons-id .nm{font-weight:600;font-size:15.5px}
.cons-id .ttl{font-size:13px;color:var(--muted)}
.cons-why{font-size:13.5px;color:var(--text);margin-top:10px}
.cons-domain{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.cons-domain b{color:var(--fg)}
.cons-more{margin-top:10px;font-size:13px}
.cons-more summary{cursor:pointer;color:var(--soft);font-weight:500;list-style:none}
.cons-more summary::-webkit-details-marker{display:none}
.cons-more summary::before{content:"CV  ▸ ";font-weight:600}
.cons-more[open] summary::before{content:"CV  ▾ "}
.cv{margin-top:10px;background:var(--surface);border-radius:8px;padding:14px;font-size:13px;color:var(--text)}
.cons-fid{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.cons-fid code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.copyfid{border:0;background:transparent;color:var(--soft);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:6px}
.copyfid:hover{background:var(--surface);color:var(--fg)}
.cvlabel{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.cv .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cv .tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--soft)}

.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent}
.btn[disabled]{opacity:.5;cursor:default}
.btn-primary{background:var(--green);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line-strong)}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.resolved{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--soft)}
.lockmsg{font-size:13.5px;color:var(--muted)}

.settings{max-width:760px;padding-bottom:64px;display:flex;flex-direction:column;gap:20px}
.panel{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.panel-hd{padding:18px 20px;border-bottom:1px solid var(--line)}
.panel-hd h3{font-size:18px;font-weight:600}
.panel-hd p{font-size:13.5px;color:var(--muted);margin-top:4px}
.panel-bd{padding:8px 20px 18px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{min-width:0}
.row .t{font-weight:600;font-size:14.5px}
.row .s{font-size:12.5px;color:var(--muted)}
.row .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.statusdot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soft)}
.statusdot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:4px 6px;border-radius:6px}
.x:hover{background:var(--surface);color:var(--fg)}
.addform{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.addform input{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;flex:1 1 150px;min-width:0;background:var(--surface)}
.dedup ul{margin:8px 0 0;padding-left:18px;color:var(--text);font-size:13.5px;line-height:1.6}

.scrim{position:fixed;inset:0;background:rgba(10,8,14,.62);display:grid;place-items:center;padding:24px;z-index:50}
.modal{background:var(--card);border-radius:16px;max-width:540px;width:100%;max-height:86vh;overflow:auto;border:1px solid var(--line)}
.modal-hd{padding:22px 24px;border-bottom:1px solid var(--line)}
.modal-hd h3{font-size:22px;font-weight:600}
.modal-bd{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:13px;color:var(--soft);margin-bottom:6px;font-weight:500}
.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;min-height:72px;background:var(--surface)}
.modal-ft{padding:18px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--inv-bg);color:var(--inv-fg);padding:13px 20px;border-radius:999px;font-size:14px;font-weight:500;z-index:60}
.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.mockflag{font-size:12px;font-weight:500;color:var(--soft);background:var(--hl);border-radius:999px;padding:6px 11px}
.actionbar{background:var(--surface)}
.conrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.conrow:first-child{border-top:0}
.conrow .cava{width:34px;height:34px;border-radius:50%;background:var(--ph);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--soft);flex:0 0 auto}
.conrow .main{min-width:0;flex:1}
.conrow .t{font-weight:600;font-size:14.5px}
.conrow .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conrow .right{display:flex;gap:10px;align-items:center}
.linkbtn{border:0;background:transparent;color:var(--fg);font-size:13px;text-decoration:underline;text-underline-offset:2px;padding:4px}
.field input{width:100%;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface)}
.hint{font-size:12.5px;color:var(--muted)}
.parsebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-radius:8px;padding:12px;font-size:13px}

/* Nærhetsmarkør, samme oppdrag, lenker, vedlegg */
.nearpill{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#7fd9b8;background:rgba(75,194,162,.16);padding:2px 8px;border-radius:999px;white-space:nowrap;margin-left:4px}
.samelist{display:flex;flex-direction:column;gap:8px}
.sameitem{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px}
.sameitem:hover{border-color:var(--line-strong)}
.sameitem .nm{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sameitem .s{font-size:14.5px;font-weight:600;color:var(--fg);line-height:1.3}
.linklist{display:flex;flex-direction:column;gap:9px}
.emaillink{font-size:14px;color:#8fd0f0;text-decoration:none;word-break:break-all;line-height:1.4}
.emaillink:hover{text-decoration:underline}
.attlist{display:flex;flex-wrap:wrap;gap:10px}
.attitem{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px;font-size:14px;font-weight:500;color:var(--fg)}
.attitem:hover{border-color:var(--line-strong)}
.attitem .sz{font-size:12px;color:var(--muted);font-weight:400}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gatecard">
    <div class="wordmark">Figment</div>
    <h1>Kvalifiseringstavla</h1>
    <p id="gatemsg">Kobler til …</p>
    <div class="spinner" id="gatespin"></div>
    <button class="gatebtn" id="loginbtn" hidden>Logg inn med Figment</button>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-in gutter">
      <span class="brand">
        <span class="wordmark">Figment</span>
        <span class="divider"></span>
        <span class="app">Kvalifiseringstavla</span>
      </span>
      <nav class="viewnav" id="viewnav">
        <button data-view="requests" aria-current="true">Forespørsler</button>
        <button data-view="settings" aria-current="false">Innstillinger</button>
      </nav>
      <button class="importbtn" id="importbtn">+ Importer</button>
      <span class="spacer"></span>
      <span class="userchip" id="userchip">
        <span class="uava" id="uava"></span>
        <span class="uname" id="uname"></span>
        <button class="logout" id="logout">Logg ut</button>
      </span>
    </div>
  </header>

  <div class="gutter" id="viewRequests">
    <div class="catnav" id="catnav" role="tablist" aria-label="Kategori"></div>
    <div class="locfilter" id="locfilter" hidden>
      <span class="lbl">Lokasjon</span>
      <div class="locchips" id="locchips"></div>
      <button class="locclear" id="locclear" hidden>Nullstill</button>
    </div>
    <div class="toolbar">
      <div class="tabs" id="tabs" role="group" aria-label="Filtrer på status"></div>
      <span class="spacer"></span>
      <span class="sortnote">Sortert på matchscore</span>
    </div>
    <div class="layout">
      <div class="list" id="list" role="list"></div>
      <div id="detailWrap"></div>
    </div>
  </div>

  <div class="gutter" id="viewSettings" hidden>
    <div class="settings" id="settingsBody"></div>
  </div>
</div>

<div id="modalMount"></div>
<div id="toastMount" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
// ---------- Konfig (offentlig; anon-nøkkel er RLS-beskyttet) ----------
const SUPABASE_URL = "https://wocrhuiyzrckxihqzrla.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvY3JodWl5enJja3hpaHF6cmxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0NDE3NDcsImV4cCI6MjExMTAxNzc0N30.CKXkBswIQlHXIM3U3LkbnVuUwDQvRxhZR1O9fwHdKqM";
const ALLOWED_DOMAINS = ["figment.no", "sonat.no"];

// lock: passthrough deaktiverer Web Locks API, som kan få getSession til å
// henge for alltid i enkelte nettlesere/kontekster (kjent supabase-js-problem).
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    flowType: "pkce",
    lock: (_name, _acquireTimeout, fn) => fn(),
  },
});

const REL = {
  svak:{label:"Svak",n:1,col:"var(--pill)"}, middels:{label:"Middels",n:2,col:"var(--amber)"},
  sterk:{label:"Sterk",n:3,col:"var(--purple)"}, veldig_sterk:{label:"Veldig sterk",n:4,col:"var(--green)"},
};
const REC = { kvalifiser:{label:"Kvalifiser",col:"#7fd9b8",pill:"rec-kvalifiser"},
  vurder:{label:"Vurder",col:"#dbbd72",pill:"rec-vurder"}, avvis:{label:"Avvis",col:"#e39a9a",pill:"rec-avvis"} };
const STATUS_LABELS = {ny:"Ny", kvalifisert:"Kvalifisert", avvist:"Avvist", feil:"Feil"};
const OFFICE = ["Oslo","Bergen"];
const PIPEDRIVE_DOMAIN = "sonat";
const dealUrl = id => `https://${PIPEDRIVE_DOMAIN}.pipedrive.com/deal/${encodeURIComponent(id)}`;

let REQUESTS = [], ACCOUNTS = [], DOMAINS = [], CONSULTS = [], SKIPPED = [];
let pendingCvPath = null;
let view="requests", filter="ny", selCat="klar", selLoc=new Set(), selectedId=null, me=null;
const CATLABEL = {klar:"Verifiserte forespørsler", mulig:"Mulige forespørsler"};

const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? "").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tier(p){ return p>=70?"strong":p>=40?"med":"low"; }
function tone(p){ return p>=70?"good":p>=50?"mid":"bad"; }
function initials(nm){ return (nm||"?").split(" ").filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase(); }
function ringColor(p){ return p>=70?"var(--green)":p>=40?"var(--purple)":"var(--pill)"; }
function scoresOf(r){ return (r.match_scores||[]).slice().sort((a,b)=>b.score-a.score); }
function consOf(r){ return (r.consultant_matches||[]).slice().sort((a,b)=>b.match_percent-a.match_percent); }
function topArea(r){ const s=scoresOf(r)[0]; return s?{pct:s.score, name:s.service_areas?.name||"—"}:{pct:r.total_score??0, name:"—"}; }
function relMeter(level, big){ const m=REL[level]; if(!m) return ""; let seg=""; for(let i=1;i<=4;i++) seg+=`<i class="${i<=m.n?'on':''}"></i>`; return `<span class="${big?'meter big':'meter'}" style="--rc:${m.col}">${seg}</span>`; }
function locsOf(r){ return Array.isArray(r.locations)?r.locations:[]; }
function cityList(r){ return locsOf(r).filter(l=>l!=="Remote"&&l!=="Hybrid"); }
function consSorted(r){
  const cities=new Set(cityList(r).map(c=>c.toLowerCase()));
  const near=cm=>cities.size && cities.has(((cm.consultants||{}).location||"").toLowerCase());
  return consOf(r).slice().sort((a,b)=>{
    const d=(near(a)?0:1)-(near(b)?0:1); if(d) return d;
    return (b.match_percent||0)-(a.match_percent||0);
  });
}
function sameOppOf(r){ return r.opportunity_group_id ? REQUESTS.filter(x=>x.id!==r.id && x.opportunity_group_id===r.opportunity_group_id) : []; }
function domOf(email){ const p=(email||"").split("@"); return p.length>1?p[1].toLowerCase():""; }
function brokerName(r){
  const d=domOf(r.from_email), dom=DOMAINS.find(x=>(x.domain||"").toLowerCase()===d);
  if(dom&&dom.label) return dom.label;
  if(d){ const core=d.replace(/\.(com|no|org|io|net|se|dk|eu)$/i,"").split(".").pop(); return core?core.charAt(0).toUpperCase()+core.slice(1):d; }
  return r.from_email||"Ukjent leverandør";
}
function custActLabel(s){ return s>=100?"Flere pågående oppdrag":s>=80?"Pågående oppdrag":s>=50?"Tidligere oppdrag":"Ingen kjent aktivitet"; }
function custActTier(s){ return s>=80?"strong":s>=50?"med":"low"; }
const enrichAttempted=new Set();
function maybeEnrichCustomer(r){
  if(!r||!r.org_name||r.customer_activity!=null||enrichAttempted.has(r.id)) return;
  enrichAttempted.add(r.id);
  callFn("enrich-customer",{request_id:r.id}).then(()=>loadData()).catch(()=>{});
}
function groupMembers(r){ return r.opportunity_group_id ? REQUESTS.filter(x=>x.opportunity_group_id===r.opportunity_group_id) : [r]; }
function nyMembers(r){ return groupMembers(r).filter(m=>m.status==="ny"); }
function groupVisible(){
  const rs=visible(), seen=new Set(), out=[];
  for(const r of rs){
    const gid=r.opportunity_group_id;
    if(gid){
      if(seen.has(gid)) continue;
      seen.add(gid);
      const members=rs.filter(x=>x.opportunity_group_id===gid);
      const rep=members.slice().sort((a,b)=>topArea(b).pct-topArea(a).pct)[0];
      out.push({rep, members});
    } else out.push({rep:r, members:[r]});
  }
  return out;
}
function extractLinks(r){
  const urls=[];
  for(const m of String(r.body_html||"").matchAll(/href\s*=\s*["']([^"']+)["']/gi)) urls.push(m[1]);
  for(const m of String(r.body_text||"").matchAll(/https?:\/\/[^\s<>"')\]]+/gi)) urls.push(m[0]);
  const seen=new Set(), out=[];
  for(let u of urls){
    if(!/^https?:\/\//i.test(u)) continue;
    u=u.replace(/&amp;/gi,"&").replace(/[.,;:]+$/,"");
    if(/unsubscribe|list-manage|\/opt[-_]?out|email[-_.]?preferences/i.test(u)) continue;
    if(/fonts\.(googleapis|gstatic)\.com|schema\.org|\.w3\.org|\.(css|png|jpe?g|gif|svg|woff2?|ico|webp)(\?|#|$)/i.test(u)) continue;
    if(!seen.has(u)){ seen.add(u); out.push(u); }
    if(out.length>=15) break;
  }
  return out;
}
function locInteresting(locs){ if(!locs.length) return true; const cities=locs.filter(l=>l!=="Remote"&&l!=="Hybrid"); if(locs.includes("Remote")&&!cities.length) return true; if(cities.some(c=>OFFICE.includes(c))) return true; if(!cities.length) return true; return false; }

function recommend(r){
  const ta=topArea(r), svc=ta.pct, bc=consOf(r)[0], cons=bc?bc.match_percent:null, rn=r.relationship_level?REL[r.relationship_level].n:null, locs=locsOf(r), locGood=locInteresting(locs);
  const factors=[{label:"Tjeneste",val:svc+"%",tone:tone(svc)}];
  if(cons!=null) factors.push({label:"Konsulent",val:cons+"%",tone:tone(cons)});
  if(rn!=null) factors.push({label:"Relasjon",val:REL[r.relationship_level].label,tone:rn>=3?"good":rn===2?"mid":"bad"});
  const dlvl = bc && bc.domain_level ? REL[bc.domain_level].n : null;
  if(dlvl!=null) factors.push({label:"Domene",val:REL[bc.domain_level].label,tone:dlvl>=3?"good":dlvl===2?"mid":"bad"});
  if(locs.length) factors.push({label:"Lokasjon",val:locs.join(" / "),tone:locGood?"good":"bad"});
  if(r.customer_activity!=null) factors.push({label:"Kunde",val:r.customer_activity+"/100",tone:r.customer_activity>=80?"good":r.customer_activity>=50?"mid":"bad"});
  if(svc<35) return {verdict:"avvis", why:`Tjenestematch bare ${svc}% – utenfor Figments tjenesteområder.`, factors};
  let pts=0;
  pts += svc>=70?2:svc>=50?1:0;
  if(cons!=null) pts += cons>=70?2:cons>=50?1:0; else pts+=1;
  if(rn!=null && rn>=3) pts+=1;
  if(dlvl!=null && dlvl>=3) pts+=1;
  if(locGood) pts+=1;
  if(r.customer_activity!=null && r.customer_activity>=80) pts+=1;
  const neg=[];
  if(rn!=null&&rn<3) neg.push("svak relasjon");
  if(locs.length&&!locGood) neg.push(`${locs.join("/")} er mindre prioritert`);
  if(cons!=null&&cons<50) neg.push("svak konsulentmatch");
  let verdict = pts>=5?"kvalifiser":pts<=2?"avvis":"vurder";
  let why = verdict==="kvalifiser" ? `Høy match på tjeneste (${svc}%)${cons!=null?` og konsulent (${cons}%)`:""}.`
          : verdict==="vurder" ? `Lovende fagmatch, men ${neg.join(" og ")||"noe usikkerhet"} trekker ned.`
          : `Svak samlet match${neg.length?`: ${neg.join(", ")}`:""}.`;
  return {verdict, why, factors};
}

// ---------- Datahenting ----------
async function loadData(){
  const sel = `id,subject,title,from_email,from_name,to_email,received_at,deadline,status,category,category_confidence,category_reasoning,category_overridden,total_score,domain,locations,start_date,duration,start_iso,end_iso,assumed_product,customer_activity,customer_activity_signals,opportunity_group_id,org_name,contact_name,pipedrive_org_id,relationship_level,relationship_signals,pipedrive_deal_id,rejection_reason,body_text,body_html,`
    + `attachments(filename,content_type,size_bytes,storage_path),`
    + `match_scores(score,reasoning,service_areas(key,name)),`
    + `consultant_matches(match_percent,reasoning,domain_level,domain_reasoning,consultants(id,name,title,company,location,years_experience,skills,keywords,certifications,summary,flowcase_user_id))`;
  const [{data:reqs, error:e1}, {data:accs}, {data:doms}, {data:cons}, {data:skip}] = await Promise.all([
    sb.from("requests").select(sel).order("total_score",{ascending:false, nullsFirst:false}),
    sb.from("inbox_accounts").select("*").order("email"),
    sb.from("sender_domains").select("*").order("domain"),
    sb.from("consultants").select("id,name,title,location,years_experience,email,skills,keywords,certifications,summary,master_cv,available,flowcase_user_id").order("name"),
    sb.from("skipped_senders").select("*").order("last_seen",{ascending:false}),
  ]);
  if(e1){ toast("Kunne ikke hente data: "+e1.message); }
  REQUESTS = reqs||[]; ACCOUNTS = accs||[]; DOMAINS = doms||[]; CONSULTS = cons||[]; SKIPPED = skip||[];
  if(!selectedId || !REQUESTS.some(r=>r.id===selectedId)) selectedId = visible()[0]?.id || null;
  render();
}

function afterLocation(){ if(!selLoc.size) return REQUESTS.slice(); return REQUESTS.filter(r=>locsOf(r).some(l=>selLoc.has(l))); }
function catOf(r){ return r.category||"mulig"; }
function afterCategory(){ return afterLocation().filter(r=>catOf(r)===selCat); }
function catCounts(){ const b=afterLocation(); let klar=0,mulig=0; b.forEach(r=>{catOf(r)==="klar"?klar++:mulig++}); return {klar,mulig}; }
function counts(){ const b=afterCategory(); const c={ny:0,kvalifisert:0,avvist:0,feil:0,alle:b.length}; b.forEach(r=>{c[r.status]=(c[r.status]||0)+1}); return c; }
function visible(){ let rs=afterCategory(); if(filter!=="alle") rs=rs.filter(r=>r.status===filter); return rs.sort((a,b)=>topArea(b).pct-topArea(a).pct); }
function allLocations(){ const s=new Set(); REQUESTS.forEach(r=>locsOf(r).forEach(l=>s.add(l))); return [...s]; }

// ---------- Render ----------
function renderLoc(){
  const locs=allLocations(); const f=$("locfilter");
  if(!locs.length){ f.hidden=true; return; } f.hidden=false;
  $("locchips").innerHTML = locs.map(l=>`<button class="locchip" data-loc="${esc(l)}" aria-pressed="${selLoc.has(l)}">${esc(l)} <span class="cnt">${REQUESTS.filter(r=>locsOf(r).includes(l)).length}</span></button>`).join("");
  $("locclear").hidden = selLoc.size===0;
}
function renderCat(){
  const c=catCounts();
  $("catnav").innerHTML = [["klar",CATLABEL.klar,c.klar],["mulig",CATLABEL.mulig,c.mulig]]
    .map(([k,l,n])=>`<button class="catseg" role="tab" aria-selected="${selCat===k}" data-cat="${k}">${l} <span class="cnt">${n}</span></button>`).join("");
}
function renderTabs(){
  const c=counts();
  const defs=[["ny","Nye",c.ny],["kvalifisert","Kvalifiserte",c.kvalifisert],["avvist","Avviste",c.avvist],["alle","Alle",c.alle]];
  $("tabs").innerHTML = defs.map(([k,l,n])=>`<button class="tab" aria-pressed="${filter===k}" data-f="${k}">${l} <span class="cnt">${n}</span></button>`).join("");
}
function renderList(){
  const entries=groupVisible();
  if(!entries.length){ $("list").innerHTML='<div class="card empty">Ingen forespørsler i denne visningen.</div>'; return; }
  $("list").innerHTML = entries.map(({rep:r, members})=>{
    const ta=topArea(r), rec=recommend(r), locs=locsOf(r), rl=r.relationship_level?REL[r.relationship_level]:null;
    const grouped=members.length>1;
    const brokers=[...new Set(members.map(m=>brokerName(m)))];
    return `<button class="card item${grouped?' stacked':''}" data-id="${r.id}" aria-current="${selectedId===r.id}">
      ${grouped?`<span class="stackbadge">${members.length} brokere</span>`:""}
      <div class="eyebrow">${esc(grouped?brokers.slice(0,2).join(", ")+(brokers.length>2?` +${brokers.length-2}`:""):(r.org_name||r.from_email||"Ukjent avsender"))}</div>
      <h3>${esc(r.title||r.subject||"(uten emne)")}</h3>
      <div class="meta"><span>${esc((r.received_at||"").slice(0,10))}</span>${locs.length?`<span class="sep">·</span><span>${esc(locs.join(" / "))}</span>`:""}</div>
      <div class="foot">
        <div class="bestmatch"><span class="pct txt-${tier(ta.pct)}">${ta.pct}%</span><span class="nm">${esc(ta.name)}</span></div>
        <span class="rec-pill ${REC[rec.verdict].pill}">Forslag: ${REC[rec.verdict].label}</span>
      </div>
      <div class="subrow">${rl?relMeter(r.relationship_level)+`<span>${esc(rl.label)} relasjon</span><span class="sep">·</span>`:""}<span class="chip ${r.status}">${STATUS_LABELS[r.status]||r.status}</span>${grouped?`<span class="sep">·</span><span class="samemark">samme oppdrag</span>`:""}</div>
    </button>`;
  }).join("");
}
function renderDetail(){
  const wrap=$("detailWrap"); const r=REQUESTS.find(x=>x.id===selectedId);
  if(!r){ wrap.innerHTML='<div class="detail"><div class="empty">Velg en forespørsel i listen.</div></div>'; return; }
  maybeEnrichCustomer(r);
  const rec=recommend(r), rm=REC[rec.verdict];
  const ss=scoresOf(r), bestKey=ss[0]?.service_areas?.key;
  const svcHtml = ss.length ? ss.map(s=>{ const p=s.score,t=tier(p),nm=s.service_areas?.name||"—",isBest=s.service_areas?.key===bestKey;
    return `<div class="svc-row"><div class="svc-name">${isBest?`<mark>${esc(nm)}</mark><span class="star">· beste match</span>`:esc(nm)}</div>
      <div class="svc-pct txt-${t}">${p}%</div><div class="bar"><i class="tier-${t}" style="width:${p}%"></i></div>
      <div class="svc-why">${esc(s.reasoning||"")}</div></div>`; }).join("")
    : '<div class="muted-note">Ingen tjenestescore ennå.</div>';

  const oppCities=new Set(cityList(r).map(c=>c.toLowerCase()));
  const cs=consSorted(r);
  const consHtml = cs.length ? cs.map(cm=>{ const c=cm.consultants||{}, p=cm.match_percent;
    const near=oppCities.size && oppCities.has((c.location||"").toLowerCase());
    return `<div class="cons-card"><div class="cons-top">
        <div class="ring" style="background:conic-gradient(${ringColor(p)} ${p}%, var(--surface) 0)"><b>${p}%</b></div>
        <div class="cons-id"><div class="nm">${esc(c.name)}${near?' <span class="nearpill">📍 Nær lokasjon</span>':''}</div><div class="ttl">${esc([c.title,c.location,c.years_experience?c.years_experience+" år":null].filter(Boolean).join(" · "))}</div></div></div>
      <div class="cons-why">${esc(cm.reasoning||"")}</div>
      ${cm.domain_level?`<div class="cons-domain">${relMeter(cm.domain_level)}<span>Domene: <b>${esc(REL[cm.domain_level].label)}</b>${cm.domain_reasoning?" — "+esc(cm.domain_reasoning):""}</span></div>`:""}
      ${(c.summary||(c.keywords||[]).length||(c.certifications||[]).length)?`<details class="cons-more"><summary>masterCV</summary><div class="cv">${c.summary?esc(c.summary):""}
        ${(c.keywords||[]).length?`<div class="cvlabel">Nøkkelord (hele CV, inkl. prosjekter)</div><div class="tags">${(c.keywords||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>`:""}
        ${(c.certifications||[]).length?`<div class="cvlabel">Sertifiseringer</div><div class="tags">${(c.certifications||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>`:""}</div></details>`:""}
      </div>`; }).join("")
    : '<div class="muted-note">Ingen konsulentmatch ennå.</div>';

  const rl=r.relationship_level?REL[r.relationship_level]:null, s=r.relationship_signals||{};
  const sigChips = Object.keys(s).length ? [
    ["deals","dealer"],["won","vunnet"],["activities","aktiviteter"],["emails","e-poster"],["contacts","kontakter"]
  ].filter(([k])=>s[k]!=null).map(([k,l])=>`<span class="sig"><b>${esc(s[k])}</b> ${l}</span>`).join("") + (s.last_contact?`<span class="sig">Sist: <b>${esc(s.last_contact)}</b></span>`:"") : "";
  const ca=r.customer_activity, cas=r.customer_activity_signals||{};
  const custActHtml = r.org_name ? `<div class="custact">
      <div class="custact-top"><span class="custact-score txt-${custActTier(ca||0)}">${ca!=null?ca:"…"}</span><span class="custact-max">/100</span><span class="custact-lbl">${ca!=null?esc(custActLabel(ca)):"Kunde-aktivitet hentes …"}</span></div>
      ${ca!=null?`<div class="bar"><i class="tier-${custActTier(ca)}" style="width:${ca}%"></i></div>`:""}
      ${cas.ongoing!=null?`<div class="custact-why">${cas.ongoing} pågående · ${cas.previous} tidligere oppdrag i Pipedrive</div>`:(cas.reason?`<div class="custact-why">${esc(cas.reason)}</div>`:"")}
    </div>` : "";
  const orgSection = (r.org_name||rl) ? `<div class="section"><h4>Kunde og relasjon</h4>
      <div class="org"><div><div class="nm">${esc(r.org_name||"Ukjent kunde")}</div><div class="org-meta">${esc(r.contact_name||r.from_email||"")}</div></div></div>
      ${custActHtml}
      ${rl?`<div class="relbox"><div class="relhead"><span class="relbadge">Relasjon: ${esc(rl.label)}</span>${relMeter(r.relationship_level,true)}</div>
        ${sigChips?`<div class="signals">${sigChips}</div>`:""}</div>`:'<div class="relbox"><span class="muted-note">Ikke beriket fra Pipedrive ennå.</span></div>'}

async function callFn(name, body){
  const { data:{session} } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, { method:"POST",
    headers:{ "Content-Type":"application/json", apikey:SUPABASE_ANON, Authorization:`Bearer ${session.access_token}` },
    body: JSON.stringify(body) });
  let out={}; try{ out=await res.json(); }catch(_){}
  if(!res.ok || out.error) throw new Error(out.error||("HTTP "+res.status));
  return out;
}

async function extractCvText(file){
  const name=(file.name||"").toLowerCase();
  if(name.endsWith(".txt")) return await file.text();
  if(name.endsWith(".docx") && window.JSZip){
    const zip=await window.JSZip.loadAsync(await file.arrayBuffer());
    const xml=await zip.file("word/document.xml").async("string");
    return xml.replace(/<\/w:p>/g,"\n").replace(/<[^>]+>/g," ").replace(/[ \t]{2,}/g," ").trim();
  }
  return "";
}
async function onCvFile(input){
  const file=input.files&&input.files[0]; if(!file) return;
  const st=$("cv-status");
  try{
    st.textContent="Laster opp …";
    const path=`${Date.now()}_${file.name.replace(/[^\w.\-]+/g,"_")}`;
    const up=await sb.storage.from("cvs").upload(path, file, {upsert:true});
    if(up.error) throw up.error;
    pendingCvPath=path;
    const text=await extractCvText(file);
    if(!text){ st.textContent="Lastet opp (kan ikke tolkes automatisk – fyll inn feltene)."; return; }
    st.textContent="Tolker CV med KI …";
    const out=await callFn("parse-cv", {cv_text:text.slice(0,16000)});
    const f=out.fields||out;
    if(f.name && !$("c-name").value) $("c-name").value=f.name;
    if(f.title) $("c-title").value=f.title;
    if(f.location) $("c-loc").value=f.location;
    if(f.years_experience) $("c-years").value=f.years_experience;
    if(Array.isArray(f.skills)) $("c-skills").value=f.skills.join(", ");
    if(Array.isArray(f.certifications)) $("c-certs").value=f.certifications.join(", ");
    if(f.summary) $("c-summary").value=f.summary;
    st.textContent="CV tolket – se over feltene og lagre.";
  }catch(e){ st.textContent="CV lastet opp, men tolkning feilet ("+(e.message||e)+") – fyll inn manuelt."; }
}

      <div class="field"><label for="c-name">Navn</label><input id="c-name" type="text" value="${esc(c.name||"")}"></div>
      <div class="field"><label for="c-title">Tittel</label><input id="c-title" type="text" value="${esc(c.title||"")}"></div>
      <div class="field"><label for="c-loc">Lokasjon</label><input id="c-loc" type="text" value="${esc(c.location||"")}"></div>
      <div class="field"><label for="c-years">År erfaring</label><input id="c-years" type="number" value="${c.years_experience??""}"></div>
      <div class="field"><label for="c-skills">Ferdigheter (komma)</label><input id="c-skills" type="text" value="${esc(skills)}"></div>
      <div class="field"><label for="c-certs">Sertifiseringer (komma)</label><input id="c-certs" type="text" value="${esc(certs)}"></div>
      <div class="field"><label for="c-summary">Sammendrag (masterCV)</label><textarea id="c-summary">${esc(c.summary||"")}</textarea></div>
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" data-act="cancel">Avbryt</button>
      <button class="btn btn-primary" data-act="save-con" data-id="${c.id||""}">Lagre</button></div>
  </div></div>`;
}
async function saveConsultant(id){
  const list=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
  const years=$("c-years").value.trim();
  const row={
    name:$("c-name").value.trim(),
    title:$("c-title").value.trim()||null,
    location:$("c-loc").value.trim()||null,
    years_experience:years?parseInt(years,10):null,
    skills:list($("c-skills").value),
    certifications:list($("c-certs").value),
    summary:$("c-summary").value.trim()||null,
  };
  if(!row.name){ toast("Navn er påkrevd"); return; }
  if(pendingCvPath) row.master_cv={cv_path:pendingCvPath};
  try{
    if(id) await sb.from("consultants").update(row).eq("id", id);
    else { row.available=true; await sb.from("consultants").insert(row); }
    closeModal(); await loadData(); render(); toast(id?"Konsulent oppdatert":"Konsulent lagt til");
  }catch(e){ toast("Lagring feilet: "+(e.message||e)); }
}

// ---------- Hendelser ----------
$("viewnav").addEventListener("click",e=>{ const b=e.target.closest("[data-view]"); if(b){ view=b.dataset.view; render(); }});
$("catnav").addEventListener("click",e=>{ const b=e.target.closest("[data-cat]"); if(!b) return; selCat=b.dataset.cat; selectedId=visible()[0]?.id||null; render(); });
$("locchips").addEventListener("click",e=>{ const b=e.target.closest("[data-loc]"); if(!b) return; const l=b.dataset.loc; selLoc.has(l)?selLoc.delete(l):selLoc.add(l); render(); });
$("locclear").addEventListener("click",()=>{ selLoc.clear(); render(); });
$("tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-f]"); if(b){ filter=b.dataset.f; render(); }});
$("list").addEventListener("click",e=>{ const b=e.target.closest("[data-id]"); if(b){ selectedId=b.dataset.id; render(); if(window.matchMedia("(max-width:860px)").matches) $("detailWrap").scrollIntoView({behavior:"smooth"}); }});
$("detailWrap").addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b) return; const r=REQUESTS.find(x=>x.id===selectedId); if(!r) return; if(b.dataset.act==="selectreq"){ selectedId=b.dataset.rid; render(); return; }
  if(b.dataset.act==="openatt"){ openAttachment(b.dataset.path, b.dataset.name); return; }
  if(b.dataset.act==="copy-fid"){ try{ navigator.clipboard.writeText(b.dataset.fid); toast("Flowcase-ID kopiert"); }catch(_){ toast("Kunne ikke kopiere"); } return; }
  if(b.dataset.act==="qualify") qualifyConsultantModal(r, false);
  if(b.dataset.act==="reject") rejectModal([r]);
  if(b.dataset.act==="qualify-group") qualifyChooseModal(nyMembers(r));
  if(b.dataset.act==="reject-group") rejectModal(nyMembers(r));
  if(b.dataset.act==="movecat") doMoveCat(r); if(b.dataset.act==="reopen") doReopen(r);
  if(b.dataset.act==="unqualify") doUnqualify(r); });
$("modalMount").addEventListener("click",e=>{
  if(e.target.matches("[data-scrim]")||e.target.closest('[data-act="cancel"]')){ closeModal(); return; }
  const sc=e.target.closest('[data-act="save-con"]'); if(sc){ saveConsultant(sc.dataset.id||null); return; }
  const pb=e.target.closest('[data-act="pick-broker"]'); if(pb){ pendingGroupBroker=pb.dataset.rid; qualifyConsultantModal(REQUESTS.find(x=>x.id===pb.dataset.rid), true); return; }
  const pc=e.target.closest('[data-act="pick-consultant"]'); if(pc){ const cid=pc.dataset.cid||""; if(pc.dataset.group==="1"){ doQualifyGroup(pendingGroupBroker, cid); } else { doQualify(REQUESTS.find(x=>x.id===pc.dataset.rid), cid); } return; }
  if(e.target.closest('[data-act="do-import"]')){ doImport(); return; }
  if(e.target.closest('[data-act="confirm-reject"]')){ const t=$("rr"); doReject(pendingReject, (t&&t.value.trim())||""); }});
$("modalMount").addEventListener("change",e=>{ if(e.target.id==="cv-file") onCvFile(e.target); });
$("viewSettings").addEventListener("click",async e=>{ const b=e.target.closest("[data-act]"); if(!b) return;
  try{
    if(b.dataset.act==="rm-account"){ await sb.from("inbox_accounts").delete().eq("id",b.dataset.id); await loadData(); }
    if(b.dataset.act==="rm-domain"){ await sb.from("sender_domains").delete().eq("id",b.dataset.id); await loadData(); }
    if(b.dataset.act==="add-account"){ const em=$("acc-email").value.trim(); if(em){ await sb.from("inbox_accounts").insert({email:em, imap_host:$("acc-host").value.trim()||null}); await loadData(); toast("Konto lagt til"); }}
    if(b.dataset.act==="add-domain"){ const dm=$("dom-domain").value.trim().toLowerCase(); if(dm){ await sb.from("sender_domains").insert({domain:dm, label:$("dom-label").value.trim()||null}); await loadData(); toast("Domene lagt til"); }}
    if(b.dataset.act==="add-skipped"){ const dm=(b.dataset.domain||"").toLowerCase(); if(dm){ await sb.from("sender_domains").insert({domain:dm}); await sb.from("skipped_senders").delete().eq("domain",dm); await loadData(); toast("La til "+dm); }}
    if(b.dataset.act==="dismiss-skipped"){ await sb.from("skipped_senders").delete().eq("domain",b.dataset.domain); await loadData(); }
    if(b.dataset.act==="add-con"){ consultantModal(null); }
    if(b.dataset.act==="edit-con"){ consultantModal(CONSULTS.find(c=>c.id===b.dataset.id)); }
    if(b.dataset.act==="del-con"){ const c=CONSULTS.find(x=>x.id===b.dataset.id); if(!window.confirm("Slette "+(c?c.name:"konsulent")+"?")) return; await sb.from("consultants").delete().eq("id",b.dataset.id); await loadData(); render(); toast("Konsulent slettet"); }
  }catch(err){ toast("Handling feilet: "+err.message); }});
$("importbtn").addEventListener("click", importModal);
$("logout").addEventListener("click",()=> sb.auth.signOut());
$("loginbtn").addEventListener("click",()=> sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: location.origin+location.pathname } }));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

// ---------- Innlogging ----------
function showGate(state, extra){
  $("app").hidden=true; $("gate").hidden=false; $("gatespin").hidden=true; $("loginbtn").hidden=true;
  if(state==="loading"){ $("gatemsg").textContent="Kobler til …"; $("gatespin").hidden=false; }
  else if(state==="out"){ $("gatemsg").textContent="Logg inn med din Figment-konto for å se brokerforespørslene."; $("loginbtn").hidden=false; }
  else if(state==="denied"){ $("gatemsg").textContent=`${extra||"Kontoen"} har ikke tilgang. Bruk en @figment.no- eller @sonat.no-konto.`; $("loginbtn").hidden=false; }
  else if(state==="error"){ $("gatemsg").textContent="Innlogging feilet: "+(extra||"ukjent feil")+". Prøv igjen."; $("loginbtn").hidden=false; }
}
function showApp(){
  $("gate").hidden=true; $("app").hidden=false;
  $("uname").textContent = me.user_metadata?.full_name || me.email || "Innlogget";
  const av=$("uava"), url=me.user_metadata?.avatar_url;
  if(url){ av.innerHTML=""; av.style.background=`center/cover url("${encodeURI(url)}")`; } else { av.textContent=initials(me.user_metadata?.full_name||me.email); }
}
async function handleSession(session){
  if(!session){ me=null; showGate("out"); return; }
  const email=(session.user.email||"").toLowerCase();
  const ok = ALLOWED_DOMAINS.some(d=>email.endsWith("@"+d));
  if(!ok){ await sb.auth.signOut(); showGate("denied", email); return; }
  me = session.user; showApp(); await loadData();
}
function urlAuthError(){
  try{
    const h=new URLSearchParams((location.hash||"").replace(/^#/,""));
    const q=new URLSearchParams(location.search||"");
    const e=h.get("error_description")||h.get("error")||q.get("error_description")||q.get("error");
    return e?decodeURIComponent(String(e).replace(/\+/g," ")):null;
  }catch(_){ return null; }
}
let authShown=false;
async function showFor(session){
  if(authShown) return;
  authShown=true;
  try{ await handleSession(session); }
  catch(err){ authShown=false; showGate("error", String((err&&err.message)||err)); }
}
async function init(){
  showGate("loading");
  const ae=urlAuthError();
  if(ae){ try{ history.replaceState(null,"",location.pathname); }catch(_){}; showGate("error", ae); return; }
  sb.auth.onAuthStateChange((evt, session)=>{
    if(session) showFor(session);
    else if(evt==="SIGNED_OUT"){ authShown=false; me=null; showGate("out"); }
  });
  // Poll kun ved retur fra OAuth (kode i URL); ellers vis status umiddelbart.
  const returning = /[?&#]code=/.test(location.href);
  const tries = returning ? 30 : 1;
  for(let i=0; i<tries && !authShown; i++){
    try{ const r=await sb.auth.getSession(); if(r && r.data && r.data.session){ await showFor(r.data.session); break; } }
    catch(_){}
    if(i < tries-1) await new Promise(res=>setTimeout(res, 400));
  }
  if(!authShown) await handleSession(null);
}
init();
</script>
